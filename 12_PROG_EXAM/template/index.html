<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Jungle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

</head>

<body>
    <div id="timer">0 sek</div>

    <main>

        <!-- STARTSIDE -->
        <div class="page" id="start" title="Start">
            <div class="overlay">
                <h1>vacation sprint!</h1>
                <p>complete your vacation as fast as posible! your boss is timing you. so be fast!</p>
                <button id="btn-start">Start vacation</button>
            </div>
        </div>

        <!-- RUM 1: JUNGLEN -->
        <div class="page" id="room1" title="Horse-petting">
            <div id="room1-hint" class="hint">pet a horse! click on the correct spots to pet him!</div>
            <div id="room1-pet" class="pet-counter">petted spots: 0 / 3</div>

            <div id="symbol1" class="hotspot">🧿</div>
            <div id="symbol2" class="hotspot">🧿</div>
            <div id="symbol3" class="hotspot">🧿</div>
        </div>

        <!-- RUM 2: LYSNINGEN -->
        <div class="page" id="room2" title="Lysningen">
            <div id="room2-hint" class="hint"> time to cloud watch! click on on the clouds. smallest to largest</div>

            <!-- Klikbare skyer -->
            <div id="cloud1" class="hotspot cloud">☁️</div>
            <div id="cloud2" class="hotspot cloud">🌥️</div>
            <div id="cloud3" class="hotspot cloud">⛅</div>

        </div>

        <!-- SLUTSIDE -->
        <div class="page" id="complete" title="Færdig">
            <div class="overlay">
                <h1>you did it! you finished vacation!</h1>
                <p id="final-time"></p>
                <button id="btn-restart">Spil igen</button>
            </div>
        </div>

    </main>
    <script src="./index.js"></script>
</body>

</html>
